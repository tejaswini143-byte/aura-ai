# Render Blueprint for the AURA FastAPI backend.
# Free testing configuration: filesystem is ephemeral and SQLite data may be lost
# on restart/redeploy. Use managed persistent storage before relying on saved data.
services:
  - type: web
    name: aura-ai-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: AURA_ENVIRONMENT
        value: production
      - key: DATABASE_PATH
        value: /tmp/aura.db
      - key: AURA_PUBLIC_BASE_URL
        value: https://aura-ai-1-a83b.onrender.com
      - key: AURA_OUTBOUND_CALLS_ENABLED
        value: "false"
      - key: AURA_PROACTIVE_CALLS_ENABLED
        value: "false"
      - key: AURA_PHONE_VERIFICATION_ENABLED
        value: "false"
      - key: AURA_MAX_CALLS_PER_DAY
        value: "3"
      - key: AURA_MAX_CALL_DURATION_SECONDS
        value: "120"
      - key: AURA_SESSION_COOKIE_SAMESITE
        value: strict
      - key: GNANI_LANGUAGE
        value: te-IN
      - key: AURA_VOICE_ENGINE
        value: gemini_live
      - key: AURA_ADMIN_PASSWORD
        generateValue: true
      - key: AURA_ACTIONS_API_TOKEN
        generateValue: true

# Add private environment variables in the Render dashboard after creating the service.
# Never commit their values here:
# AURA_PUBLIC_BASE_URL, AURA_ALLOWED_ORIGINS, GEMINI_API_KEY,
# GNANI_API_KEY, GNANI_TTS_VOICE, TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN,
# TWILIO_FROM_NUMBER, TWILIO_VERIFY_SERVICE_SID.
